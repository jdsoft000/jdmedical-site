<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" role="img" aria-label="MC TECH symbol">
  <!-- Soft boomerang ㄱ/ㄴ matching hand sketch: large-radius bends, half-overlap → green via opacity -->
  <g transform="translate(130 130)" fill="none" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <!-- TL yellow -->
    <path stroke="#FFD432" d="M -13 -102 L -13 -30 Q -13 -4 -36 -4 L -102 -4"/>
    <!-- TR blue -->
    <path stroke="#4AA8FF" d="M 13 -102 L 13 -30 Q 13 -4 36 -4 L 102 -4"/>
    <!-- BL blue -->
    <path stroke="#4AA8FF" d="M -13 102 L -13 30 Q -13 4 -36 4 L -102 4"/>
    <!-- BR yellow -->
    <path stroke="#FFD432" d="M 13 102 L 13 30 Q 13 4 36 4 L 102 4"/>
  </g>
</svg>
