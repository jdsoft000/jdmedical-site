<!DOCTYPE html>

  <body>
    <a class="skip" href="#main">본문으로 건너뛰기</a>
    <div class="page-bg">

        <header class="site-header">

            <img
              class="brand-logo"
              src="images/jd-medical-symbol.svg"

              height="32"

              <span>JDmedical Co., Ltd.</span>

          <nav class="nav" aria-label="주요 메뉴">

            <a href="business" aria-current="page">사업</a>

            <a href="partner">협력</a>

              <li>실험·연구용 장비 관련 <strong style="color: var(--text)">제조 및 협력 생산</strong></li>
              <li>품질·일정 관리에 따른 <strong style="color: var(--text)">납품 지원</strong></li>

            </ul>
          </div>

          <figure class="media-panel">
            <img
              src="images/sign/800x800.jpg"
              width="1600"
              height="1600"
              alt="병원, 대학, 연구소, 공공·국제협력, 요식업 등 JD MEDICAL 사업 분야 다이어그램"

        <footer class="site-footer">

          <nav aria-label="푸터">
